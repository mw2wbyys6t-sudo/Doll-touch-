<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#ffb6c1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>星空爱莉 - AI助手</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="header" role="banner">
      <div class="header-left">
        <div class="avatar-large" role="img" aria-label="星空爱莉的头像">🎤</div>
        <h1 class="header-title">星空爱莉</h1>
      </div>
      <div class="header-right">
        <button class="header-icon-btn" aria-label="特效">✨</button>
        <button class="header-icon-btn" aria-label="设置">⚙️</button>
      </div>
    </header>

    <main class="main-content" role="main">
      <div class="chat-container" id="chatContainer" aria-live="polite" aria-label="聊天消息">
        <div class="message-bubble ai">
          <div class="avatar ai-avatar" role="img" aria-label="爱莉">🎤</div>
          <div class="message-content">
            <span class="message-name">爱莉</span>
            <p class="message-text">みんなを笑顔にする！それが、私のアイドルの魔法だよっ☆</p>
            <time class="message-time">刚刚</time>
          </div>
        </div>
      </div>

      <nav class="quick-actions" aria-label="快捷功能">
        <button class="action-btn" onclick="handleAction('write')" aria-label="写文案">
          <span class="action-icon" aria-hidden="true">📝</span>
          <span class="action-label">写文案</span>
        </button>
        <button class="action-btn" onclick="handleAction('schedule')" aria-label="日程管理">
          <span class="action-icon" aria-hidden="true">📅</span>
          <span class="action-label">日程</span>
        </button>
        <button class="action-btn" onclick="handleAction('image')" aria-label="生成图片">
          <span class="action-icon" aria-hidden="true">🖼️</span>
          <span class="action-label">图片</span>
        </button>
        <button class="action-btn" onclick="handleAction('music')" aria-label="音乐推荐">
          <span class="action-icon" aria-hidden="true">🎵</span>
          <span class="action-label">音乐</span>
        </button>
      </nav>

      <div class="input-bar" role="form">
        <label for="messageInput" class="visually-hidden">输入消息</label>
        <button class="input-btn emoji-btn" onclick="toggleEmojiPicker()" aria-label="选择表情" aria-expanded="false" aria-controls="emojiPicker">😊</button>
        <input 
          type="text" 
          class="input-field" 
          id="messageInput" 
          placeholder="和爱莉聊天…" 
          autocomplete="off"
          aria-label="输入消息"
          onkeypress="handleKeyPress(event)"
        >
        <button 
          class="input-btn voice-btn" 
          id="voiceBtn" 
          onclick="toggleVoiceRecording()"
          aria-label="语音输入"
          aria-pressed="false"
        >🎤</button>
      </div>

      <div class="emoji-picker" id="emojiPicker" role="dialog" aria-label="表情选择器" aria-hidden="true">
        <div class="emoji-grid" role="listbox" aria-label="可用表情">
          <span role="option" aria-label="笑脸">😀</span>
          <span role="option" aria-label="笑脸">😃</span>
          <span role="option" aria-label="笑脸">😄</span>
          <span role="option" aria-label="笑脸">😁</span>
          <span role="option" aria-label="笑脸">😆</span>
          <span role="option" aria-label="笑脸">😅</span>
          <span role="option" aria-label="笑脸">🤣</span>
          <span role="option" aria-label="笑脸">😂</span>
          <span role="option" aria-label="笑脸">🙃</span>
          <span role="option" aria-label="笑脸">😉</span>
          <span role="option" aria-label="笑脸">😇</span>
          <span role="option" aria-label="笑脸">😊</span>
          <span role="option" aria-label="笑脸">😋</span>
          <span role="option" aria-label="笑脸">😌</span>
          <span role="option" aria-label="笑脸">😍</span>
          <span role="option" aria-label="笑脸">🥰</span>
          <span role="option" aria-label="笑脸">🤩</span>
          <span role="option" aria-label="笑脸">😘</span>
          <span role="option" aria-label="笑脸">😗</span>
          <span role="option" aria-label="笑脸">😚</span>
          <span role="option" aria-label="笑脸">😙</span>
          <span role="option" aria-label="笑脸">🥲</span>
          <span role="option" aria-label="笑脸">🥹</span>
          <span role="option" aria-label="笑脸">😋</span>
          <span role="option" aria-label="笑脸">🤔</span>
          <span role="option" aria-label="笑脸">🤨</span>
          <span role="option" aria-label="面无表情">😐</span>
          <span role="option" aria-label="面无表情">😑</span>
          <span role="option" aria-label="面无表情">😶</span>
          <span role="option" aria-label="笑脸">😏</span>
          <span role="option" aria-label="笑脸">😒</span>
          <span role="option" aria-label="笑脸">😬</span>
          <span role="option" aria-label="笑脸">🥵</span>
          <span role="option" aria-label="笑脸">🥶</span>
          <span role="option" aria-label="笑脸">🥴</span>
          <span role="option" aria-label="笑脸">😵</span>
          <span role="option" aria-label="笑脸">🤐</span>
          <span role="option" aria-label="笑脸">🤯</span>
          <span role="option" aria-label="笑脸">🤢</span>
          <span role="option" aria-label="笑脸">🤮</span>
          <span role="option" aria-label="笑脸">🤒</span>
          <span role="option" aria-label="笑脸">🤕</span>
          <span role="option" aria-label="笑脸">🤓</span>
          <span role="option" aria-label="笑脸">🧐</span>
          <span role="option" aria-label="面无表情">😕</span>
          <span role="option" aria-label="无表情">😟</span>
          <span role="option" aria-label="无表情">🙁</span>
          <span role="option" aria-label="无表情">☹️</span>
        </div>
      </div>
    </main>

    <nav class="bottom-nav" role="navigation" aria-label="主导航">
      <button class="nav-item active" onclick="switchTab('chat')" aria-label="聊天" aria-current="page">
        <span class="nav-icon" aria-hidden="true">💬</span>
        <span class="nav-label">聊天</span>
      </button>
      <button class="nav-item" onclick="switchTab('tasks')" aria-label="任务">
        <span class="nav-icon" aria-hidden="true">📋</span>
        <span class="nav-label">任务</span>
      </button>
      <button class="nav-item" onclick="switchTab('create')" aria-label="创作">
        <span class="nav-icon" aria-hidden="true">🎨</span>
        <span class="nav-label">创作</span>
      </button>
      <button class="nav-item" onclick="switchTab('profile')" aria-label="我的">
        <span class="nav-icon" aria-hidden="true">👤</span>
        <span class="nav-label">我的</span>
      </button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
