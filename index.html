<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffb6c1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>星空爱莉 - AI助手</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-left">
        <div class="avatar-large">🎤</div>
        <span class="header-title">星空爱莉</span>
      </div>
      <div class="header-right">
        <span class="header-icon">✨</span>
        <span class="header-icon">⚙️</span>
      </div>
    </header>

    <main class="main-content">
      <div class="chat-container" id="chatContainer">
        <div class="message-bubble ai">
          <div class="avatar ai-avatar">🎤</div>
          <div class="message-content">
            <span class="message-name">爱莉</span>
            <p class="message-text">みんなを笑顔にする！それが、私のアイドルの魔法だよっ☆</p>
            <span class="message-time">刚刚</span>
          </div>
        </div>
      </div>

      <div class="quick-actions">
        <button class="action-btn" onclick="handleAction('write')">
          <span class="action-icon">📝</span>
          <span class="action-label">写文案</span>
        </button>
        <button class="action-btn" onclick="handleAction('schedule')">
          <span class="action-icon">📅</span>
          <span class="action-label">日程</span>
        </button>
        <button class="action-btn" onclick="handleAction('image')">
          <span class="action-icon">🖼️</span>
          <span class="action-label">图片</span>
        </button>
        <button class="action-btn" onclick="handleAction('music')">
          <span class="action-icon">🎵</span>
          <span class="action-label">音乐</span>
        </button>
      </div>

      <div class="input-bar">
        <button class="input-btn emoji-btn" onclick="toggleEmojiPicker()">😊</button>
        <input 
          type="text" 
          class="input-field" 
          id="messageInput" 
          placeholder="和爱莉聊天..." 
          onkeypress="handleKeyPress(event)"
        >
        <button 
          class="input-btn voice-btn" 
          id="voiceBtn" 
          onclick="toggleVoiceRecording()"
        >🎤</button>
      </div>

      <div class="emoji-picker" id="emojiPicker" style="display: none;">
        <div class="emoji-grid">
          😀 😃 😄 😁 😆 😅 🤣 😂
          🙃 😉 😇 😊 😋 😌 😍 🥰
          🤩 😘 😗 😚 😙 🥲 🥹 😋
          🤔 🤨 😐 😑 😶 😏 😒 😬
          🥵 🥶 🥴 😵 🤐 🤯 🤢 🤮
          🤒 🤕 🤓 🧐 😕 😟 🙁 ☹️
        </div>
      </div>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" onclick="switchTab('chat')">
        <span class="nav-icon">💬</span>
        <span class="nav-label">聊天</span>
      </button>
      <button class="nav-item" onclick="switchTab('tasks')">
        <span class="nav-icon">📋</span>
        <span class="nav-label">任务</span>
      </button>
      <button class="nav-item" onclick="switchTab('create')">
        <span class="nav-icon">🎨</span>
        <span class="nav-label">创作</span>
      </button>
      <button class="nav-item" onclick="switchTab('profile')">
        <span class="nav-icon">👤</span>
        <span class="nav-label">我的</span>
      </button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
