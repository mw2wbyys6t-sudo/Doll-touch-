apply plugin: 'com.huawei.ohos.app'

ohos {
    compileSdkVersion 11
    buildToolsVersion "4.1.0.4"

    defaultConfig {
        productName "AiriAI"
        versionCode 1
        versionName "1.0.0"
        minSdkVersion 9
        targetSdkVersion 11
        deviceTypes ["phone"]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-ohos.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        debug {
            storeFile 'debug.keystore'
            storePassword 'ohosdebug'
            keyAlias 'ohosdebugkey'
            keyPassword 'ohosdebug'
        }
    }

    buildFeatures {
        stageBased = true
    }

    dependencies {
        implementation fileTree(dir: 'libs', include: ['*.jar', '*.har'])
        implementation 'com.huawei.ohos.app:app:4.0.0.0'
    }
}
