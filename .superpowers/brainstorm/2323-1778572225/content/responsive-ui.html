<h2>星空爱莉 - 响应式移动端界面设计</h2>

<style>
  :root {

    --safe-area-inset-right: env(safe-area-inset-right);
  }
  
  .responsive-container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    border-radius: 30px;
    overflow: hidden;
    border: 4px solid #e0e0e0;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    background: white;
  }
  
  .header {
    background: linear-gradient(135deg, #ffb6c1 0%, #dda0dd 50%, #b19cd9 100%);

    padding: 1rem 1.25rem;

    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  
  .header-avatar {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
  }
  
  .header-title {
    font-size: 1.125rem;
    margin-left: 0.5rem;
  }
  
  .main-content {
    background: linear-gradient(180deg, #fff0f5 0%, #f3e5f5 100%);
    padding: 1rem;
    min-height: calc(100vh - 8rem - var(--safe-area-inset-top) - var(--safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }
  
  .message-bubble {
    background: white;
    border-radius: 1.25rem;
    padding: 1rem;

    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    display: flex;
    gap: 0.625rem;
  }

  }
  
  .avatar {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 50%;

  }

    color: #999;
    font-size: 0.6875rem;
    margin-top: 0.25rem;

  .input-bar {

    gap: 0.75rem;

    border-radius: 1.5625rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);

  .input-btn {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 50%;

    align-items: center;
    justify-content: center;
    font-size: 1.125rem;

    flex-shrink: 0;

    color: #666;

  }

    flex: 1;
    padding: 0.75rem;
    border: none;
    outline: none;
    font-size: 0.875rem;
    background: transparent;
  }
  
  .quick-actions {
    display: flex;
    gap: 0.625rem;
    margin-top: 0.75rem;
    justify-content: space-between;
  }
  
  .action-item {
    flex: 1;
    text-align: center;
    padding: 0.75rem 0.5rem;

    border-radius: 1rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);

  }
  
  .action-icon {
    font-size: 1.375rem;
    margin-bottom: 0.25rem;
  }
  
  .action-label {
    font-size: 0.6875rem;
    color: #666;
  }
  
  .bottom-nav {
    background: white;
    padding: 0.5rem;
    padding-bottom: calc(0.5rem + var(--safe-area-inset-bottom));
    display: flex;
    justify-content: space-around;
    border-top: 1px solid #f0f0f0;
  }
  
  .nav-item {
    text-align: center;
    padding: 0.5rem 1rem;
    cursor: pointer;
    color: #999;
    transition: color 0.2s;
  }
  
  .nav-item.active {
    color: #e91e63;
  }
  
  .nav-icon {
    font-size: 1.375rem;
    margin-bottom: 0.125rem;
  }
  
  .nav-label {
    font-size: 0.625rem;
  }
  
  @media (min-width: 320px) {
    .header {
      padding: 1rem 1rem;
      padding-top: calc(1rem + var(--safe-area-inset-top));
    }
    
    .main-content {
      padding: 0.75rem;
    }
  }
  
  @media (min-width: 414px) {
    .header {
      padding: 1.125rem 1.25rem;
      padding-top: calc(1.125rem + var(--safe-area-inset-top));

      font-size: 1.25rem;
    }
    
    .main-content {
      padding: 1rem;
    }
    
    .message-text {
      font-size: 0.9375rem;
    }
    
    .input-field {
      font-size: 0.9375rem;
    }
    
    .action-icon {
      font-size: 1.5rem;
    }
    
    .nav-icon {
      font-size: 1.5rem;
    }
  }
  
  @media (min-width: 480px) {
    .header {
      padding: 1.25rem 1.5rem;
      padding-top: calc(1.25rem + var(--safe-area-inset-top));
    }
    
    .header-avatar {
      width: 2.5rem;
      height: 2.5rem;
      font-size: 1.125rem;
    }
    
    .header-title {
      font-size: 1.375rem;
    }
    
    .avatar {
      width: 2.5rem;
      height: 2.5rem;
      font-size: 1rem;
    }
    
    .message-text {
      font-size: 1rem;
    }
    
    .input-btn {
      width: 3rem;
      height: 3rem;
      font-size: 1.25rem;
    }
    
    .input-field {
      font-size: 1rem;
    }
    
    .action-icon {
      font-size: 1.625rem;
    }
    
    .action-label {
      font-size: 0.75rem;
    }
    
    .nav-icon {
      font-size: 1.625rem;
    }
    
    .nav-label {
      font-size: 0.6875rem;
    }
  }
</style>
