<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星空爱莉 App Icon</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #1a0a3e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }
  
  .icon-container {
    width: 1024px;
    height: 1024px;
    position: relative;
    border-radius: 204px;
    overflow: hidden;
  }
  
  .background {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #1a0a3e 0%, #2d1b69 25%, #4a2c8a 50%, #FF6B9D 100%);
  }
  
  .stars {
    position: absolute;
    width: 100%;
    height: 100%;
  }
  
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
  }
  
  @keyframes twinkle {
    0% { opacity: 0.3; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1.2); }
  }
  
  .anime-girl {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
  }
  
  .hair {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #FFB6C1 0%, #FF69B4 50%, #FF1493 100%);
    border-radius: 50% 50% 40% 40%;
    clip-path: polygon(50% 0%, 80% 10%, 90% 30%, 85% 60%, 70% 80%, 50% 100%, 30% 80%, 15% 60%, 10% 30%, 20% 10%);
  }
  
  .face {
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 220px;
    background: linear-gradient(135deg, #FFE4E1 0%, #FFDAB9 100%);
    border-radius: 50% 50% 45% 45%;
  }
  
  .eye {
    position: absolute;
    width: 40px;
    height: 50px;
    background: linear-gradient(135deg, #8A2BE2 0%, #FF69B4 100%);
    border-radius: 50%;
    top: 60px;
  }
  
  .eye.left { left: 45px; }
  .eye.right { right: 45px; }
  
  .eye-shine {
    position: absolute;
    width: 15px;
    height: 15px;
    background: white;
    border-radius: 50%;
    top: 15px;
    left: 10px;
  }
  
  .mouth {
    position: absolute;
    width: 30px;
    height: 15px;
    background: #FF69B4;
    border-radius: 0 0 50% 50%;
    top: 140px;
    left: 50%;
    transform: translateX(-50%);
  }
  
  .cheek {
    position: absolute;
    width: 25px;
    height: 15px;
    background: rgba(255, 105, 180, 0.6);
    border-radius: 50%;
    top: 110px;
  }
  
  .cheek.left { left: 25px; }
  .cheek.right { right: 25px; }
  
  .sparkles {
    position: absolute;
    width: 100%;
    height: 100%;
  }
  
  .sparkle {
    position: absolute;
    width: 20px;
    height: 20px;
    background: white;
    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    animation: sparkle-twinkle 1.5s infinite alternate;
  }
  
  @keyframes sparkle-twinkle {
    0% { transform: scale(0.5) rotate(0deg); opacity: 0.5; }
    100% { transform: scale(1) rotate(180deg); opacity: 1; }
  }
  
  .glow {
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>
  <div class="icon-container">
    <div class="background"></div>
    
    <div class="stars" id="stars"></div>
    
    <div class="glow"></div>
    
    <div class="anime-girl">
      <div class="hair"></div>
      <div class="face">
        <div class="eye left">
          <div class="eye-shine"></div>
        </div>
        <div class="eye right">
          <div class="eye-shine"></div>
        </div>
        <div class="cheek left"></div>
        <div class="cheek right"></div>
        <div class="mouth"></div>
      </div>
    </div>
    
    <div class="sparkles" id="sparkles"></div>
  </div>

  <script>
    // Generate stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 50; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.width = Math.random() * 4 + 1 + 'px';
      star.style.height = star.style.width;
      star.style.animationDelay = Math.random() * 2 + 's';
      star.style.animationDuration = Math.random() * 2 + 1 + 's';
      starsContainer.appendChild(star);
    }
    
    // Generate sparkles
    const sparklesContainer = document.getElementById('sparkles');
    for (let i = 0; i < 12; i++) {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.style.left = 15 + Math.random() * 70 + '%';
      sparkle.style.top = 15 + Math.random() * 70 + '%';
      sparkle.style.animationDelay = Math.random() * 1.5 + 's';
      sparkle.style.width = 10 + Math.random() * 20 + 'px';
      sparkle.style.height = sparkle.style.width;
      sparklesContainer.appendChild(sparkle);
    }
  </script>
</body>
</html>
