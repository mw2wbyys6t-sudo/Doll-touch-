  <ellipse cx="400" cy="720" rx="200" ry="150" fill="#FF69B4" opacity="0.05" filter="url(#softGlow)"/>
  <ellipse cx="700" cy="650" rx="170" ry="130" fill="#00F0FF" opacity="0.04" filter="url(#softGlow)"/>
  <ellipse cx="150" cy="600" rx="150" ry="120" fill="#E066FF" opacity="0.05" filter="url(#softGlow)"/>
  <ellipse cx="850" cy="750" rx="190" ry="145" fill="#FF2D95" opacity="0.04" filter="url(#softGlow)"/>

