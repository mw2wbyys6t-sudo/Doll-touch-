<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1045"/>
      <stop offset="40%" stop-color="#1a0830"/>
      <stop offset="70%" stop-color="#100520"/>
      <stop offset="100%" stop-color="#05000a"/>
    </radialGradient>
    
    <radialGradient id="coreGlow" cx="512" cy="492" r="220">
      <stop offset="0%" stop-color="#FF2D95" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#C41E7A" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6B1042" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="innerCore" cx="502" cy="482" r="100">
      <stop offset="0%" stop-color="#E0F7FF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#B8E8F5" stop-opacity="0.72"/>
      <stop offset="80%" stop-color="#7BAFD4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4A7A9D" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB6D5"/>
      <stop offset="40%" stop-color="#FF69B4"/>
      <stop offset="80%" stop-color="#FF1493"/>
      <stop offset="100%" stop-color="#DB1179"/>
    </linearGradient>
    
    <linearGradient id="faceGrad" x1="30%" y1="20%" x2="70%" y2="85%">
      <stop offset="0%" stop-color="#FFF0F3"/>
      <stop offset="70%" stop-color="#FFE4E8"/>
      <stop offset="100%" stop-color="#F5D0D8"/>
    </linearGradient>
    
    <radialGradient id="eyeGrad" cx="45%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#E066FF"/>
      <stop offset="35%" stop-color="#D94EFF"/>
      <stop offset="70%" stop-color="#B829FF"/>
      <stop offset="100%" stop-color="#8A1FE0"/>
    </radialGradient>
    
    <radialGradient id="eyeGlow" cx="47%" cy="420" r="38">
      <stop offset="0%" stop-color="#FF69FF" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#D94EFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8A1FE0" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="pupilGrad" cx="48%" cy="44%" r="45%">
      <stop offset="0%" stop-color="#2D0A3D"/>
      <stop offset="70%" stop-color="#1A0528"/>
      <stop offset="100%" stop-color="#0F021A"/>
    </radialGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
    
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="2"/>
