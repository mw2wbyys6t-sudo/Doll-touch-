      <stop offset="50%" stop-color="#FF6BB6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF2D95" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="ring2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C41EE0" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#E066FF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#C41EE0" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="ring3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#66FAFF" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.05"/>
